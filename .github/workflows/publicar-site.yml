# Publica o site da CaveirIA e libera cada vídeo agendado só depois da hora dele.
# Roda quando o PC envia o site (push), de 15 em 15 minutos, ou à mão (Actions → Run workflow).
name: Publicar site

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - id: liberar
        name: Montar o site e destrancar os vídeos que já saíram
        run: python3 .github/liberar.py
        env:
          SITE_CHAVE: ${{ secrets.SITE_CHAVE }}

      - if: steps.liberar.outputs.publicar == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        if: steps.liberar.outputs.publicar == 'true'
        uses: actions/deploy-pages@v4
